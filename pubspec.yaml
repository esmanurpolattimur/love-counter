name: ask_sayaci
description: Birlikte geçen zamanı takip eden ilişki yıldönümü sayacı.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  flutter_local_notifications: ^17.2.4
  flutter_timezone: ^5.1.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
